server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

app.database.path=${APP_DATABASE_PATH:./data/house-app.db}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me-32bytes}
app.jwt.access-token-seconds=${APP_JWT_ACCESS_TOKEN_SECONDS:900}
app.refresh-token-days=${APP_REFRESH_TOKEN_DAYS:7}
app.refresh-token-remember-days=${APP_REFRESH_TOKEN_REMEMBER_DAYS:30}

spring.datasource.url=jdbc:sqlite:${app.database.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-stacktrace=never
server.error.include-message=never
